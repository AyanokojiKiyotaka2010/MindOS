services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mindos
      MYSQL_USER: mindos_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-before-beta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/database/migrations/002_social_network.up.sql:/docker-entrypoint-initdb.d/002_social_network.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://mindos_app:${MYSQL_PASSWORD:-change-me-before-beta}@mysql:3306/mindos?charset=utf8mb4
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/private_uploads:/app/private_uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
